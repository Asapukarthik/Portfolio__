<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Interactive Particle Sphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        }

        canvas {
            display: block;
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .content h1 {
            font-size: 5rem;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #ff00ff, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow:
                0 0 20px rgba(255, 0, 255, 0.4),
                0 0 40px rgba(0, 170, 255, 0.4);
        }

        .content p {
            margin-top: 15px;
            color: #aaa;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <div class="content">
        <h1>PORTFOLIO</h1>
        <p>Interactive Particle Sphere</p>
    </div>

    <script>

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        resizeCanvas();

        let particles = [];
        let rippleEffects = [];

        const mouse = {
            x: null,
            y: null,
            radius: 180 * (window.devicePixelRatio || 1)
        };

        window.addEventListener("mousemove", (e) => {
            const dpr = window.devicePixelRatio || 1;
            mouse.x = e.x * dpr;
            mouse.y = e.y * dpr;
        });

        window.addEventListener("click", (e) => {
            const dpr = window.devicePixelRatio || 1;
            rippleEffects.push({
                x: e.x * dpr,
                y: e.y * dpr,
                radius: 0,
                alpha: 1
            });
        });

        window.addEventListener("resize", () => {
            resizeCanvas();
            init();
        });

        class Particle {
            constructor() {
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);
                
                let radiusOffset = 0;
                if (Math.random() > 0.8) {
                    radiusOffset = (Math.random() - 0.5) * 200; // inner scattered
                } else {
                    radiusOffset = (Math.random() - 0.5) * 20;  // tight shell
                }

                const baseRadius = 0.35;
                this.phi = phi;
                this.theta = theta;
                this.radiusOffset = radiusOffset;
                this.baseRadiusRatio = baseRadius;

                // Color based on initial X position to match the gradient image
                // Left is purple, Right is blue
                const xNormal = Math.sin(phi) * Math.cos(theta);
                const ratio = (xNormal + 1) / 2;

                const r = Math.floor(255 * (1 - ratio));
                const g = Math.floor(100 * ratio);
                const b = 255;
                
                this.color = `rgba(${r}, ${g}, ${b}, ${Math.random() * 0.6 + 0.4})`;
                this.size = Math.random() * 1.5 + 0.5;
                
                this.rotSpeed = 0.001 + Math.random() * 0.0005;
            }

            update() {
                this.theta += this.rotSpeed;

                const sphereRadius = Math.min(canvas.width, canvas.height) * this.baseRadiusRatio;
                const r = sphereRadius + this.radiusOffset;

                const x3d = r * Math.sin(this.phi) * Math.cos(this.theta);
                const y3d = r * Math.sin(this.phi) * Math.sin(this.theta);
                const z3d = r * Math.cos(this.phi);

                const fov = 1000;
                const viewerDist = 1000;
                const scale = fov / (viewerDist + z3d);

                this.x = canvas.width / 2 + x3d * scale;
                this.y = canvas.height / 2 + y3d * scale;
                this.currentSize = Math.max(0.1, this.size * scale);

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        this.x -= dx * force * 0.1;
                        this.y -= dy * force * 0.1;
                    }
                }

                this.draw();
            }

            draw() {
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.currentSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            const totalParticles = 6000;
            for (let i = 0; i < totalParticles; i++) {
                particles.push(new Particle());
            }
        }

        function drawBackgroundGlow() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawRipples() {
            rippleEffects.forEach((ripple, index) => {
                ripple.radius += 4;
                ripple.alpha -= 0.015;
                ctx.beginPath();
                ctx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(150,100,255,${ripple.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                if (ripple.alpha <= 0) {
                    rippleEffects.splice(index, 1);
                }
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackgroundGlow();
            
            ctx.globalCompositeOperation = "lighter";

            particles.forEach((particle) => {
                particle.update();
            });

            ctx.globalCompositeOperation = "source-over";

            drawRipples();

            requestAnimationFrame(animate);
        }

        init();
        animate();

    </script>

</body>

</html>
