<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" /> <!-- Purple -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Cyan -->
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0b14" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    
    <!-- Neon Drop Shadow Glow -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Circle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.05)" stroke-width="8"/>

  <!-- Glowing Geometric Hexagon Outline -->
  <polygon points="256,40 436,144 436,368 256,472 76,368 76,144" 
           fill="none" 
           stroke="url(#glowGrad)" 
           stroke-width="12" 
           opacity="0.25"
           filter="url(#neonGlow)" />

  <polygon points="256,56 420,154 420,358 256,456 92,358 92,154" 
           fill="none" 
           stroke="url(#glowGrad)" 
           stroke-width="4" 
           opacity="0.6" />

  <!-- Futuristic "K" Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Vertical stem -->
    <rect x="160" y="140" width="48" height="232" rx="12" fill="url(#glowGrad)" />
    
    <!-- Top diagonal arm -->
    <path d="M 190 260 L 315 140 C 322 133, 334 133, 341 140 L 348 147 C 355 154, 355 166, 348 173 L 240 280 Z" fill="url(#glowGrad)" />
    
    <!-- Bottom diagonal arm -->
    <path d="M 220 250 L 338 362 C 345 369, 345 381, 338 388 L 331 395 C 324 402, 312 402, 305 395 L 180 270 Z" fill="url(#glowGrad)" />
  </g>
  
  <!-- Central Energy Core Dot -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#neonGlow)" />
</svg>